<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Portiva Logistics</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    margin:0;
    font-family:TahomA;
    background:#0b1c2c;
    color:#fff;
}

/* NAVBAR */
nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:rgba(0,0,0,0.7);
    z-index:1000;
}

nav a{
    color:#fff;
    margin:0 10px;
    text-decoration:none;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

/* HERO */
.hero{
    height:100vh;
    background:url('hero.jpg.jpg') center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:80px;
    position:relative;
}

.hero::after{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    top:0;
    left:0;
}

.hero-box{
    position:relative;
    z-index:2;
    text-align:right;
}

.hero-box img{
    width:140px;
}

.hero-box h1{
    font-size:50px;
}

.btn{
    background:#0d6efd;
    padding:10px 25px;
    border-radius:25px;
    color:#fff;
    text-decoration:none;
}

/* SERVICES */
.services{
    background:#0e2a44;
    margin-top:-60px;
    padding:30px;
    display:flex;
    justify-content:space-around;
    border-radius:15px;
    width:90%;
    margin-left:auto;
    margin-right:auto;
}

.service{
    text-align:center;
    width:22%;
}

.service i{
    font-size:40px;
    color:#0d6efd;
    margin-bottom:10px;
}

/* WORK */
.work{
    background:#eee;
    color:#000;
    padding:40px;
    text-align:center;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

.gallery img{
    width:180px;
    height:120px;
    object-fit:cover;
    border-radius:8px;
}

/* FORM */
.form{
    padding:40px;
    text-align:center;
}

.form input, .form select{
    padding:10px;
    margin:10px;
    width:180px;
}

/* FOOTER */
footer{
    background:#08131f;
    padding:20px;
    text-align:center;
}

</style>
</head>

<body>

<nav>
    <div>
        <a href="#">الرئيسية</a>
        <a href="#">خدماتنا</a>
        <a href="#">أعمالنا</a>
    </div>
    <div class="logo">PORTIVA</div>
</nav>

<!-- HERO -->
<section class="hero">
    <div class="hero-box">
        <img src="logo.png.png">
        <h1>PORTIVA LOGISTICS</h1>
        <p>التخليص الجمركي والنقل من جميع الموانئ</p>
        <a class="btn" href="#">تواصل معنا</a>
    </div>
</section>

<!-- SERVICES -->
<section class="services">

    <div class="service">
        <i class="fa-solid fa-ship"></i>
        <h3>التخليص الجمركي</h3>
    </div>

    <div class="service">
        <i class="fa-solid fa-truck"></i>
        <h3>نقل الحاويات</h3>
    </div>

    <div class="service">
        <i class="fa-solid fa-anchor"></i>
        <h3>خدمات الميناء</h3>
    </div>

    <div class="service">
        <i class="fa-solid fa-box"></i>
        <h3>إدارة الشحنات</h3>
    </div>

</section>

<!-- WORK -->
<section class="work">
    <h2>أعمالنا من أرض الواقع</h2>

    <div class="gallery">
        <img src="img1.jpg">
        <img src="img2.jpg">
        <img src="img3.jpg">
        <img src="img4.jpg">
        <img src="img5.jpg">
        <img src="img6.jpg">
        <img src="img7.jpg">
        <img src="img8.jpg">
        <img src="img9.jpg">
        <img src="img10.jpg">
        <img src="img11.jpg jpeg">
        <img src="img12.jpg jpeg">
        <img src="img13.jpg jpeg">
        <img src="img14.jpg jpeg">
        <img src="img15.jpg jpeg">
    </div>
</section>

<footer>
    © 2026 Portiva Logistics
</footer>

</body>
</html>
